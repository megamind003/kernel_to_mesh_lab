[project]
name = "panopticon"
version = "1.0.0"
description = "High-Frequency Financial Sentinel - Sub-200ms fraud detection at 5000 TPS"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["black", "ruff", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
