[package]
name = "aether"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
quinn = "0.10"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rcgen = "0.12"
ed25519-dalek = "1.0"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
mdns-sd = "0.10"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
memmap2 = "0.9"
dashmap = "5.5"
parking_lot = "0.12"
rand = "0.8"
gethostname = "0.4"
arrayref = "0.3"
curve25519-dalek = "3.2"
chacha20poly1305 = "0.10"
webpki-roots = "0.23"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

[[bin]]
name = "aether"
path = "src/main.rs"
