[package]
name = "flux"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-uring = { version = "0.4", optional = true }
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
h2 = "0.3"
quinn = "0.10"
quinn-proto = "0.10"
bytes = "1.5"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"
num_cpus = "1.16"
libc = "0.2"
# wasmtime = "16.0"  # Requires Rust 1.76+ via transitive deps
rustls = "0.21"
rustls-pemfile = "1.0"
tokio-rustls = "0.24"
rcgen = "0.11"
core_affinity = "0.8"
flume = "0.11"


[features]
default = []
io-uring = ["tokio-uring"]

[[bin]]
name = "flux"
path = "src/main.rs"
