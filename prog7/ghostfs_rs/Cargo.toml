[package]
name = "ghostfs"
version = "0.1.0"
edition = "2021"

[dependencies]
fuser = "0.14"
libc = "0.2"
image = { version = "0.24", default-features = false, features = ["png"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
ctrlc = "3.4"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
walkdir = "2.4"
